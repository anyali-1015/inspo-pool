<title>灵感池</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: phone-first notebook — sticky header with search + tag rail, content (masonry cards / list), fixed bottom tab bar, bottom sheets for detail & forms */
:root{
  --bg:#F1F0F5; --surface:#FFFFFF; --sunk:#E8E6EE; --ink:#1B1A21; --muted:#6C6A78; --line:#DFDDE7;
  --accent:#D2335C; --accent-ink:#FFFFFF; --accent-soft:#FBE3EA;
  --xhs:#FF2442; --dy:#111114; --dy-2:#25F4EE; --ins:#C13584; --other:#6C6A78;
  --shadow:0 1px 2px rgba(27,26,33,.06),0 4px 14px rgba(27,26,33,.05);

  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
  --cv-ink:#2A1A20; --cv-xhs:#FBE3EA; --cv-dy:#1B1A21; --cv-dy-ink:#EAF9F9; --cv-ins:linear-gradient(150deg,#FDE2EC,#EADCF8); --cv-other:#E8E6EE;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131217; --surface:#1D1C23; --sunk:#26242D; --ink:#EEEDF3; --muted:#9C99AA; --line:#2E2C36;
  --accent:#FF5C82; --accent-ink:#1B0C11; --accent-soft:#3A1A24;
  --dy:#EDEDF2; --other:#9C99AA; --shadow:none; color-scheme:dark;
  --cv-ink:#F4E8EC; --cv-xhs:#3A1A24; --cv-dy:#0B0A0E; --cv-dy-ink:#BFF5F3; --cv-ins:linear-gradient(150deg,#3A1A2C,#2A2140); --cv-other:#26242D}}
:root[data-theme="dark"]{
  --bg:#131217; --surface:#1D1C23; --sunk:#26242D; --ink:#EEEDF3; --muted:#9C99AA; --line:#2E2C36;
  --accent:#FF5C82; --accent-ink:#1B0C11; --accent-soft:#3A1A24;
  --dy:#EDEDF2; --other:#9C99AA; --shadow:none; color-scheme:dark;
  --cv-ink:#F4E8EC; --cv-xhs:#3A1A24; --cv-dy:#0B0A0E; --cv-dy-ink:#BFF5F3; --cv-ins:linear-gradient(150deg,#3A1A2C,#2A2140); --cv-other:#26242D}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;margin:0;text-wrap:balance}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.hright{display:flex;align-items:center;gap:8px}
.status{font-size:12px;color:var(--muted);margin-top:2px}
.status:empty{display:none}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:100%;font-size:16px}
.search svg{flex:none;color:var(--muted)}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.65}
.rail .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

main{padding-block:6px calc(140px + env(safe-area-inset-bottom,0px))}

/* idea cards — masonry */
.masonry{column-count:2;column-gap:10px}
@media (min-width:640px){.masonry{column-count:3}}
.card{break-inside:avoid;margin-bottom:10px;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.card h3{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.35;margin:8px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card p{margin:0 0 8px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px}
.plat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.02em}
.plat i{width:8px;height:8px;border-radius:2px;display:inline-block}
.plat.xhs{color:var(--xhs)} .plat.xhs i{background:var(--xhs)}
.plat.douyin{color:var(--dy)} .plat.douyin i{background:var(--dy);box-shadow:2px 2px 0 var(--dy-2)}
.plat.ins{color:var(--ins)} .plat.ins i{background:var(--ins);border-radius:50%}
.plat.other{color:var(--other)} .plat.other i{background:var(--other)}

/* title list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .body{flex:1;min-width:0}
.trow .text{font-size:15px;overflow-wrap:anywhere;margin-bottom:4px}
.trow .tags{margin-top:2px}
.iconbtn{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;height:32px;min-width:32px;padding:0 10px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.iconbtn.ok{color:var(--accent);border-color:var(--accent)}
.rowbtns{display:flex;gap:6px;flex:none}

/* creators */
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .name{font-weight:600;font-size:16px;overflow-wrap:anywhere;min-width:0}
.crow .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.crow .comment{grid-column:1/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.golink{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:10px;background:var(--ink);color:var(--bg);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.golink.disabled{background:var(--sunk);color:var(--muted);pointer-events:none}
.textbtn{border:0;background:none;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}

.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:14px}
.empty b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);margin-bottom:6px}

/* tab bar + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
nav.tabs button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-selected="true"] svg{color:var(--accent)}
.fab{position:fixed;z-index:7;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(210,51,92,.35)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,8,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:82%;max-height:min(82%,calc(100dvh - 120px));overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-top:0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));will-change:transform}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.sheethead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;height:40px;margin:0 -4px 4px;background:var(--surface);touch-action:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheetx{position:absolute;right:0;top:6px;width:32px;height:32px;border-radius:50%;border:0;background:var(--sunk);color:var(--ink);display:flex;align-items:center;justify-content:center}
.sheetx svg{width:14px;height:14px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:21px;margin:4px 0 12px;line-height:1.35;overflow-wrap:anywhere;text-wrap:balance}
.sheet .note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;margin:12px 0}
.urlbox{font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;margin:10px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--xhs)}
.btn.danger.armed{background:var(--xhs);border-color:var(--xhs);color:#fff}
.btn.grow{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.input,textarea.input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:0;font-size:16px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.addtag{display:flex;gap:6px;margin-top:8px}
.addtag .input{flex:1;min-width:0;padding:8px 12px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;pointer-events:none}
.chip.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.pick.editing .chip[data-t]{border-color:var(--xhs);color:var(--xhs);background:var(--surface)}
.pick.editing .chip[data-t].armed{background:var(--xhs);color:#fff}
.chip .x{margin-left:6px;font-size:11px}
.tmlist{display:flex;flex-direction:column;margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tmrow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-top:1px solid var(--line)}
.tmrow:first-child{border-top:0}
.tmname{flex:1;min-width:0;overflow-wrap:anywhere}
.tmn{font-size:12px;color:var(--muted);white-space:nowrap}
.tmdel{height:34px;padding:0 12px;font-size:13px}
.okline{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px;font-size:14px;margin-top:6px}
.okline .dotok{flex:none;width:10px;height:10px;border-radius:50%;background:#2E9D6A;margin-top:6px}
.okline .dotok.bad{background:var(--xhs)}
/* idea preview cards (masonry, like 拍照灵感) */
.pv{break-inside:avoid;display:flex;flex-direction:column;width:100%;margin:0 0 10px;padding:0;border:0;background:var(--surface);border-radius:12px;overflow:hidden;text-align:left;box-shadow:var(--shadow)}
.cv{display:block;width:100%;max-width:100%;position:relative;overflow:hidden}
.cv.img{background:var(--sunk)}
.cv.img img{display:block;width:100%;height:100%;object-fit:cover}
.cv.gen{display:flex;flex-direction:column;justify-content:center;padding:14px 14px 30px;box-sizing:border-box;color:var(--cv-ink)}
.cvq{font-family:var(--f-display);font-size:34px;line-height:.6;opacity:.35;height:16px}
.cvt{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;text-wrap:balance}
.cvp{position:absolute;left:14px;bottom:10px;font-size:11px;letter-spacing:.08em;opacity:.7;font-weight:600}
.cv.g-xhs{background:var(--cv-xhs)} .cv.g-douyin{background:var(--cv-dy);color:var(--cv-dy-ink)} .cv.g-ins{background:var(--cv-ins)} .cv.g-other{background:var(--cv-other)}
.pvn{font-size:12px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pvb{display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px}
.pvt{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;color:var(--ink)}
.pvm{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.pvtag{font-size:11px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dcv{margin:0 0 12px;border-radius:12px;overflow:hidden;background:var(--sunk);display:flex;justify-content:center}
.dcv img{display:block;max-width:100%;max-height:36vh;object-fit:contain}
.cvpick img{display:block;max-width:100%;max-height:220px;border-radius:12px;object-fit:contain;background:var(--sunk)}
.cvbtns{display:flex;gap:8px;margin-top:8px}
.cvbtns .btn{height:36px;font-size:14px}
.vtoggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.vtoggle button{border:0;background:none;width:34px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.vtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.irow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-top:1px solid var(--line);cursor:pointer}
.irow:first-child{border-top:0}
.ith{flex:none;width:64px;height:84px;border-radius:8px;object-fit:cover;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;padding-top:12px;box-sizing:border-box;color:var(--cv-ink)}
img.ith{padding-top:0}
.ith.g-xhs{background:var(--cv-xhs)} .ith.g-douyin{background:var(--cv-dy);color:var(--cv-dy-ink)} .ith.g-ins{background:var(--cv-ins)} .ith.g-other{background:var(--cv-other)}
.ibody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.it1{font-weight:600;font-size:15px;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it2{font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it3{display:flex;align-items:center;gap:8px;min-width:0}
.idom{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

<script>
(() => {
const COLS = ["ideas","titles","creators"];
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const PLAT = {xhs:"小红书", douyin:"抖音", ins:"Instagram", other:"其他"};
const DEFAULT_TAGS = {
  ideas:["低粉爆款","POV系列","拍照灵感","可1:1模仿","健身","穿搭"],
  titles:["日常照","健身场景","忧郁","反差","干货"],
  creators:["拍照","健身","穿搭","vlog"],
  photos:["构图","姿势","光影","色调","穿搭","健身房","街拍"]
};
const TABMETA = {
  ideas:{h:"灵感池", add:"添加灵感", ph:"搜索标题、介绍、tag"},
  titles:{h:"爆款标题", add:"添加标题", ph:"搜索标题"},
  creators:{h:"参考博主", add:"添加博主", ph:"搜索博主名、备注"},
  photos:{h:"拍照灵感", add:"添加照片", ph:"搜索照片备注、tag"}
};
const state = { tab:"ideas", data:{ideas:[],titles:[],creators:[],photos:[]}, filter:{photos:{tag:null,q:""},ideas:{tag:null,q:""},titles:{tag:null,q:""},creators:{tag:null,plat:null,q:""}}, canWrite:false, mode:"loading", titleSort:"new", ideaView:(()=>{ try{ return localStorage.getItem("inspo-idea-view")||"grid"; }catch(e){ return "grid"; } })(), hidden:{ideas:[],titles:[],creators:[],photos:[]} };
let db = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- platform & share-text parsing ---------- */
function detectPlat(url){
  const u = (url||"").toLowerCase();
  if (/xiaohongshu\.com|xhslink\.(com|cn)|xhs\.cn/.test(u)) return "xhs";
  if (/douyin\.com|iesdouyin\.com/.test(u)) return "douyin";
  if (/instagram\.com|instagr\.am/.test(u)) return "ins";
  return "other";
}
function parseShare(text){
  const m = (text||"").match(/https?:\/\/[^\s，。！!、"'“”]+/);
  const url = m ? m[0].replace(/[，,。.]+$/,"") : "";
  let rest = (text||"").replace(url,"")
    .replace(/复制本条信息.*$/s,"").replace(/复制打开抖音.*?(?=【|$)/,"").replace(/打开【?小红书】?App.*$/s,"")
    .replace(/[\d.]+\s*[a-zA-Z]{2,}:\/?\s*/,"").replace(/^[\d.]+\s+/,"")
    .replace(/.{0,30}发布了一篇小红书笔记，快来看吧！/,"").replace(/😆/g,"")
    .replace(/看看【(.+?)的作品】/,"").replace(/\s+/g," ").trim();
  return {url, title:rest.slice(0,80)};
}
function normUrl(u){ u=(u||"").trim(); if(u && !/^https?:\/\//i.test(u)) u="https://"+u; return u; }

/* ---------- storage ---------- */
const LKEY = "inspo-pool-local-v1";
function loadLocal(){ try{ const j = JSON.parse(localStorage.getItem(LKEY)||"null"); if(j){ COLS.forEach(c=> state.data[c]=j[c]||[]); if(j.hidden) Object.assign(state.hidden, j.hidden); } }catch(e){} }
function saveLocal(){
  try{ const o = {hidden:state.hidden}; COLS.forEach(c=>o[c]=state.data[c]); localStorage.setItem(LKEY, JSON.stringify(o)); }catch(e){}
  mirrorSoon();
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

async function addItem(col, obj){
  const id = obj.id || uid(); delete obj.id;
  obj.createdAt = Date.now();
  if (db){ try{ await db.collection(col).doc(id).set(obj); }catch(e){ fail(e); } }
  else { state.data[col].push({id, ...obj}); saveLocal(); render(); }
  return id;
}
async function saveItem(col, id, obj){
  if (db){ try{ await db.doc(col+"/"+id).set(obj); }catch(e){ fail(e); } }
  else { const i = state.data[col].findIndex(x=>x.id===id); if(i>-1) state.data[col][i]={id,...obj}; saveLocal(); render(); }
}
async function delItem(col, id){
  if (db){ try{ await db.doc(col+"/"+id).delete(); }catch(e){ fail(e); } }
  else { state.data[col]=state.data[col].filter(x=>x.id!==id); saveLocal(); render(); }
}
function fail(e){
  const c = e && e.code;
  toast(c==="quota_exceeded" ? "存储已满，删掉一些旧内容再试" : c==="invalid_argument" ? "没有保存权限，只有页面主人可以修改" : "保存失败，请检查网络后重试");
}
function strip(o){ const {id, ...rest} = o; return rest; }

async function boot(){
  const use = window.claude && window.claude.use;
  if (!use){ localMode(); return; }
  let user = null;
  try{ [db, user] = await Promise.all([use("db"), use("user")]); }catch(e){ db=null; }
  if (!db){ localMode(); return; }
  try{ state.canWrite = user ? !!(await user.isOwner()) : true; }catch(e){ state.canWrite = true; }
  state.mode = "db"; loadPhotos(); loadCovers();
  const pending = new Set(COLS);
  const timer = setTimeout(()=>{ if(pending.size) setStatus("暂时连不上数据，显示的可能不是最新内容"); }, 10000);
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      state.data[col] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(!snap.metadata.fromCache){ pending.delete(col); if(!pending.size){ clearTimeout(timer); setStatus(state.canWrite?"":"只读模式：只有页面主人可以添加和修改"); } }
      render();
    }, err=>{ pending.delete(col); clearTimeout(timer); setStatus("数据连接中断，刷新页面重试"); });
  });
  render();
}
/* ---------- photos: IndexedDB (big storage, stays on this device) ---------- */
let idbP = null;
function idb(){
  if (!idbP) idbP = new Promise((res,rej)=>{
    const r = indexedDB.open("inspo-pool", 2);
    r.onupgradeneeded = () => { const d = r.result; ["photos","covers"].forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:"id"}); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return idbP;
}
async function idbDo(mode, fn, store="photos"){
  const d = await idb();
  return new Promise((res,rej)=>{ const tx = d.transaction(store, mode); const st = tx.objectStore(store); let out; const rq = fn(st); if(rq) rq.onsuccess = () => out = rq.result; tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
}
function photoView(rec){ return {id:rec.id, note:rec.note||"", tags:rec.tags||[], createdAt:rec.createdAt, w:rec.w, h:rec.h, url:URL.createObjectURL(rec.blob), blob:rec.blob}; }
async function loadPhotos(){
  try{ const all = await idbDo("readonly", st=>st.getAll()); state.data.photos.forEach(p=>URL.revokeObjectURL(p.url)); state.data.photos = (all||[]).map(photoView); }
  catch(e){ state.photoErr = true; }
  render();
}
async function putPhoto(rec){ await idbDo("readwrite", st=>st.put(rec)); }
async function addPhotoRec(rec){ await putPhoto(rec); state.data.photos.push(photoView(rec)); await mirrorPhoto(rec); mirrorSoon(); }
async function delPhoto(id){ await idbDo("readwrite", st=>st.delete(id)); unmirrorPhoto(id); mirrorSoon(); const p = state.data.photos.find(x=>x.id===id); if(p) URL.revokeObjectURL(p.url); state.data.photos = state.data.photos.filter(x=>x.id!==id); render(); }
/* ---------- idea covers (one image per idea, same on-device store) ---------- */
const covers = new Map();   // ideaId -> {url, blob, w, h}
async function loadCovers(){
  try{ const all = await idbDo("readonly", st=>st.getAll(), "covers"); covers.forEach(c=>URL.revokeObjectURL(c.url)); covers.clear();
    (all||[]).forEach(r=>covers.set(r.id, {url:URL.createObjectURL(r.blob), blob:r.blob, w:r.w, h:r.h})); }
  catch(e){}
  render();
}
async function setCover(id, c){
  await idbDo("readwrite", st=>st.put({id, blob:c.blob, w:c.w, h:c.h}), "covers");
  const old = covers.get(id); if(old) URL.revokeObjectURL(old.url);
  covers.set(id, {url:URL.createObjectURL(c.blob), blob:c.blob, w:c.w, h:c.h});
  mirrorCover(id, c.blob);
}
async function dropCover(id){
  try{ await idbDo("readwrite", st=>st.delete(id), "covers"); }catch(e){}
  const old = covers.get(id); if(old) URL.revokeObjectURL(old.url); covers.delete(id);
  unmirrorCover(id);
}

function compress(file, max=1600){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({blob:b,w,h}) : rej(new Error("encode")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
function blobToDataURL(b){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }

/* ---------- auto-backup (iPhone app): mirror everything into the app's Documents folder ----------
   Shows up in Files → On My iPhone → 灵感池, rides along with iCloud device backup,
   and is read back automatically if the app's web storage ever comes up empty. */
const FS = NATIVE ? (window.Capacitor.Plugins||{}).Filesystem : null;
const DOCS = "DOCUMENTS";
let mirrorT = null, lastMirror = null, mirrorOK = !!FS;
function mirrorSoon(){ if(!FS || state.restoring) return; clearTimeout(mirrorT); mirrorT = setTimeout(mirrorText, 600); }
function snapshot(){
  const o = {app:"inspo-pool", v:3, savedAt:new Date().toISOString(), hidden:state.hidden,
    photos: state.data.photos.map(p=>({id:p.id, note:p.note, tags:p.tags, createdAt:p.createdAt, w:p.w, h:p.h})),
    covers: [...covers.entries()].map(([id,c])=>({id, w:c.w, h:c.h}))};
  COLS.forEach(c=>o[c]=state.data[c]); return o;
}
async function mirrorText(){
  if(!FS) return;
  try{ await FS.writeFile({path:"data.json", data:JSON.stringify(snapshot()), directory:DOCS, encoding:"utf8"}); lastMirror = new Date(); mirrorOK = true; }
  catch(e){ mirrorOK = false; }
}
async function mirrorPhoto(rec){
  if(!FS) return;
  try{ const d = await blobToDataURL(rec.blob); await FS.writeFile({path:`photos/${rec.id}.jpg`, data:d.slice(d.indexOf(",")+1), directory:DOCS, recursive:true}); }
  catch(e){ mirrorOK = false; }
}
async function unmirrorPhoto(id){ if(FS) try{ await FS.deleteFile({path:`photos/${id}.jpg`, directory:DOCS}); }catch(e){} }
async function mirrorCover(id, blob){
  if(!FS) return;
  try{ const d = await blobToDataURL(blob); await FS.writeFile({path:`covers/${id}.jpg`, data:d.slice(d.indexOf(",")+1), directory:DOCS, recursive:true}); }
  catch(e){ mirrorOK = false; }
}
async function unmirrorCover(id){ if(FS) try{ await FS.deleteFile({path:`covers/${id}.jpg`, directory:DOCS}); }catch(e){} }
async function restoreFromMirror(){
  let j; try{ j = JSON.parse((await FS.readFile({path:"data.json", directory:DOCS, encoding:"utf8"})).data); }catch(e){ return false; }
  state.restoring = true;
  COLS.forEach(c=>{ if(Array.isArray(j[c])) state.data[c]=j[c]; });
  if (j.hidden) Object.assign(state.hidden, j.hidden);
  for (const m of (j.photos||[])){
    try{
      const r = await FS.readFile({path:`photos/${m.id}.jpg`, directory:DOCS});
      const blob = await (await fetch("data:image/jpeg;base64,"+r.data)).blob();
      const rec = {id:m.id, blob, w:m.w, h:m.h, note:m.note||"", tags:m.tags||[], createdAt:m.createdAt||Date.now()};
      await putPhoto(rec); state.data.photos.push(photoView(rec));
    }catch(e){}
  }
  for (const m of (j.covers||[])){
    try{ const r = await FS.readFile({path:`covers/${m.id}.jpg`, directory:DOCS}); const blob = await (await fetch("data:image/jpeg;base64,"+r.data)).blob(); await setCover(m.id, {blob, w:m.w, h:m.h}); }catch(e){}
  }
  state.restoring = false; saveLocal(); render();
  return true;
}
async function syncMirror(){
  const empty = COLS.every(c=>!state.data[c].length) && !state.data.photos.length;
  if (empty){ if (await restoreFromMirror()) toast("已从自动备份恢复"); return; }
  await mirrorText();
  let have = new Set();
  try{ have = new Set(((await FS.readdir({path:"photos", directory:DOCS})).files||[]).map(f=>(typeof f==="string"?f:f.name).replace(/\.jpg$/,""))); }catch(e){}
  for (const p of state.data.photos) if (!have.has(p.id)) await mirrorPhoto(p);
  let haveC = new Set();
  try{ haveC = new Set(((await FS.readdir({path:"covers", directory:DOCS})).files||[]).map(f=>(typeof f==="string"?f:f.name).replace(/\.jpg$/,""))); }catch(e){}
  for (const [id,c] of covers) if (!haveC.has(id)) await mirrorCover(id, c.blob);
}

async function localMode(){
  state.mode="local"; state.canWrite=true; loadLocal();
  setStatus(NATIVE ? "" : "数据只存在这台设备的浏览器里，记得偶尔点「备份」导出一份");
  $("#backupBtn").hidden = false;
  if (!NATIVE) try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  render();
  await Promise.all([loadPhotos(), loadCovers()]);
  if (FS) syncMirror();
}
function setStatus(t){ $("#status").textContent = t; }

/* ---------- filters ---------- */
function tagCounts(col){
  const m = new Map();
  state.data[col].forEach(it => (it.tags||[]).forEach(t => m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],"zh"));
}
function allTags(col){
  const s = new Set(tagCounts(col).map(x=>x[0]));
  DEFAULT_TAGS[col].forEach(t=>{ if(!state.hidden[col].includes(t)) s.add(t); });
  return [...s];
}
function filtered(col){
  const f = state.filter[col], q = f.q.trim().toLowerCase();
  return state.data[col]
    .filter(it => !f.tag || (it.tags||[]).includes(f.tag))
    .filter(it => !f.plat || it.platform===f.plat)
    .filter(it => !q || [it.title,it.text,it.note,it.name,it.comment,(it.tags||[]).join(" ")].join(" ").toLowerCase().includes(q))
    .sort(col==="titles" && state.titleSort==="likes"
      ? (a,b)=>((b.likes??-1)-(a.likes??-1)) || ((b.createdAt||0)-(a.createdAt||0))
      : (a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

function tagUse(col, tag){ return state.data[col].filter(it=>(it.tags||[]).includes(tag)).length; }
async function deleteTag(col, tag){
  if (DEFAULT_TAGS[col].includes(tag) && !state.hidden[col].includes(tag)) state.hidden[col].push(tag);
  const hit = state.data[col].filter(it=>(it.tags||[]).includes(tag));
  if (state.filter[col].tag===tag) state.filter[col].tag = null;
  if (col==="photos"){
    for (const p of hit){ p.tags = p.tags.filter(t=>t!==tag); try{ await putPhoto({id:p.id, blob:p.blob, w:p.w, h:p.h, createdAt:p.createdAt, note:p.note, tags:p.tags}); }catch(e){} }
  } else if (db){
    for (const it of hit) await saveItem(col, it.id, {...strip(it), tags:it.tags.filter(t=>t!==tag)});
  } else {
    hit.forEach(it=>{ it.tags = it.tags.filter(t=>t!==tag); });
  }
  saveLocal(); render();
}
function unhideTag(col, tag){ const i = state.hidden[col].indexOf(tag); if(i>-1){ state.hidden[col].splice(i,1); saveLocal(); } }

function tagManager(col){
  const drawRows = () => allTags(col).map(t=>{ const n = tagUse(col,t);
    return `<div class="tmrow"><span class="tmname">#${esc(t)}</span><span class="tmn">${n ? `${n} 条在用` : "未使用"}</span><button type="button" class="btn danger tmdel" data-del="${esc(t)}" data-n="${n}">删除</button></div>`; }).join("") || `<div class="hint" style="padding:12px">还没有 tag</div>`;
  openSheet(`<h2>管理 tag · ${TABMETA[col].h}</h2>
    <div class="hint" style="font-size:14px">删除后，这个 tag 会从所有内容上去掉，内容本身不会删。</div>
    <div class="tmlist" id="tml">${drawRows()}</div>
    <div class="actions"><button class="btn grow" id="tmdone">完成</button></div>`, s=>{
    s.querySelector("#tmdone").addEventListener("click", closeSheet);
    s.querySelector("#tml").addEventListener("click", async e=>{
      const b = e.target.closest("[data-del]"); if(!b) return;

      if (n && !b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = `从 ${n} 条移除`; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armed"); b.textContent="删除"; } }, 3000); return; }
      await deleteTag(col, b.dataset.del); toast(`已删除 #${b.dataset.del}`);
      s.querySelector("#tml").innerHTML = drawRows();
    });
  });
}

function fmtNum(n){ if(n==null) return ""; if(n>=1e4) return (Math.round(n/1e3)/10).toString().replace(/\.0$/,"")+"万"; return String(n); }
function parseNum(t){ t=String(t||"").replace(/[,\s]/g,""); const m=t.match(/([\d.]+)(万|w|W|千|k|K)?/); if(!m) return null; let n=parseFloat(m[1]); if(isNaN(n)) return null; if(/万|w|W/.test(m[2]||"")) n*=1e4; else if(/千|k|K/.test(m[2]||"")) n*=1e3; return Math.round(n); }

/* Runs on the creator's profile page in the user's own logged-in browser (bookmarklet or console).
   Scrolls the page, reads the note cards it shows, then offers the result as text to paste back here. */
function inspoExtractor(){
  if (window.__inspoRun) return; window.__inspoRun = 1;
  const host = location.hostname;
  const plat = /xiaohongshu/.test(host) ? "xhs" : /douyin/.test(host) ? "douyin" : /instagram/.test(host) ? "ins" : "other";
  const num = t => { t = String(t||"").replace(/[,\s]/g,""); const m = t.match(/([\d.]+)(万|w|W|千|k|K)?/); if(!m) return null; let n = parseFloat(m[1]); if(isNaN(n)) return null; if(/万|w|W/.test(m[2]||"")) n*=1e4; else if(/千|k|K/.test(m[2]||"")) n*=1e3; return Math.round(n); };
  const seen = new Map();
  const LINK = 'a[href*="/explore/"],a[href*="/discovery/item/"],a[href*="/user/profile/"][href*="xsec_token"],a[href*="/video/"],a[href*="/note/"],a[href*="/p/"],a[href*="/reel/"]';
  const author = (document.querySelector('.user-name, .user-nickname, [data-e2e="user-info"] h1, h1, h2')||{}).innerText || document.title;
  let lastCard = null;
  const grab = () => {
    let cards = [...document.querySelectorAll('section.note-item, [data-e2e="user-post-list"] li, [data-e2e="scroll-list"] li')];
    if (!cards.length) cards = [...document.querySelectorAll(LINK)].map(a => a.closest("li,section,article") || a.parentElement || a);
    if (cards.length) lastCard = cards[cards.length-1];
    for (const c of cards){
      const a = c.matches && c.matches("a") ? c : (c.querySelector(LINK) || c.querySelector("a[href]"));
      const href = a ? new URL(a.getAttribute("href"), location.href).href : "";
      let title = ((c.querySelector(".footer .title, .title, [class*='title']")||{}).innerText
        || (c.querySelector("p")||{}).innerText || (c.querySelector("img[alt]")||{}).alt || "").replace(/\s+/g," ").trim();
      if (!title || title.length < 2) continue;
      let lk = c.querySelector(".like-wrapper .count, [class*='like'] .count, [class*='like-count'], [data-e2e*='like']");
      let likes = lk ? num(lk.innerText) : null;
      if (likes == null){ const ns = (c.innerText||"").replace(title,"").match(/[\d.]+\s*(万|w|k)?/gi); if (ns) likes = num(ns[ns.length-1]); }
      const key = href || title;
      if (!seen.has(key)) seen.set(key, {title, likes, url:href});
    }
  };
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;z-index:2147483647;right:16px;bottom:16px;width:340px;max-width:calc(100vw - 32px);background:#1B1A21;color:#fff;border-radius:14px;padding:14px;font:14px/1.5 -apple-system,PingFang SC,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)";
  box.innerHTML = '<b>灵感池 · 抓标题</b><div id="ip-st" style="margin-top:6px;color:#C9C6D3">正在往下滚动收集…</div>';
  document.body.appendChild(box);
  const st = box.querySelector("#ip-st");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  (async () => {
    let last = 0, stall = 0;
    for (let i = 0; i < 80 && seen.size < 110; i++){
      grab(); st.textContent = "正在往下滚动收集… 已找到 " + seen.size + " 条";
      if (lastCard && lastCard.scrollIntoView) lastCard.scrollIntoView({block:"end"});
      window.scrollBy(0, Math.round(innerHeight * 0.5)); await sleep(1200); grab();
      if (seen.size === last){ if (++stall >= 4) break; } else { stall = 0; last = seen.size; }
    }
    const rows = [...seen.values()].sort((a,b) => (b.likes??-1) - (a.likes??-1));
    const text = ["#inspo-pool\t" + plat + "\t" + String(author).trim().split("\n")[0] + "\t" + location.href]
      .concat(rows.map(r => (r.likes ?? "") + "\t" + r.title.replace(/\t/g," ") + "\t" + r.url)).join("\n");
    st.innerHTML = rows.length
      ? "找到 <b>" + rows.length + "</b> 条。点复制，回到灵感池粘贴。"
      : "没找到笔记。确认已经登录、页面停在博主主页的笔记列表，再点一次书签。";
    if (!rows.length){ window.__inspoRun = 0; return; }
    const ta = document.createElement("textarea"); ta.value = text; ta.readOnly = true;
    ta.style.cssText = "width:100%;height:90px;margin-top:8px;border-radius:8px;border:0;padding:6px;font:12px monospace;color:#111;background:#fff;box-sizing:border-box";
    const bt = document.createElement("button"); bt.textContent = "复制结果";
    bt.style.cssText = "margin-top:8px;width:100%;height:38px;border:0;border-radius:10px;background:#FF5C82;color:#1B0C11;font-weight:700;font-size:15px;cursor:pointer";
    const cl = document.createElement("button"); cl.textContent = "关闭";
    cl.style.cssText = "margin-top:6px;width:100%;height:32px;border:0;border-radius:10px;background:transparent;color:#C9C6D3;cursor:pointer";
    bt.onclick = async () => { try{ await navigator.clipboard.writeText(text); bt.textContent = "已复制 ✓"; }catch(e){ ta.focus(); ta.select(); document.execCommand && document.execCommand("copy"); bt.textContent = "已选中，按 ⌘C 复制"; } };
    cl.onclick = () => { box.remove(); window.__inspoRun = 0; };
    box.append(ta, bt, cl);
  })();
}
const EXTRACT_SRC = "(" + inspoExtractor.toString() + ")()";
const BOOKMARKLET = "javascript:" + encodeURIComponent(EXTRACT_SRC);

/* parse what the extractor produced (or any pasted list: one title per line, optional likes) */
function parseImport(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let meta = {plat:"", author:"", page:""};
  const rows = []; const seen = new Set();
  for (const l of lines){
    if (l.startsWith("#inspo-pool")){ const [, plat, author, page] = l.split("\t"); meta = {plat:plat||"", author:(author||"").trim(), page:page||""}; continue; }
    let likes = null, title = l, url = "";
    const parts = l.split("\t");
    if (parts.length >= 2){ likes = parts[0] === "" ? null : parseNum(parts[0]); title = parts[1]; url = parts[2] || ""; }
    else { const m = l.match(/^(.*?)[\s|｜,，]+(♥|❤|赞)?\s*([\d.]+\s*(万|w|k)?)\s*(赞)?$/i); if (m && m[1].length > 1){ title = m[1]; likes = parseNum(m[3]); } }
    title = String(title||"").trim(); if (!title || seen.has(title)) continue;
    seen.add(title); rows.push({title, likes, url});
  }
  rows.sort((a,b)=>(b.likes??-1)-(a.likes??-1));
  return {meta, rows};
}

    </div>
    <textarea class="input" id="imptext" placeholder="粘贴抓到的结果。也可以直接粘贴一串标题，每行一条，带赞数的会自动识别"></textarea>

      picked = new Set(rows.map((r,i)=>i).filter(i=>!have.has(rows[i].title)));
      const withLikes = rows.some(r=>r.likes!=null);
      prev.innerHTML = `
        <div class="impbar"><span>识别到 <b>${rows.length}</b> 条${parsed.meta.author?`，来自 <b>${esc(parsed.meta.author)}</b>`:""}</span>
          <span class="impq">${withLikes?`<button type="button" class="chip" data-top="20">前 20</button><button type="button" class="chip" data-top="50">前 50</button>`:""}<button type="button" class="chip" data-top="all">全选</button><button type="button" class="chip" data-top="none">清空</button></span></div>
        <div class="implist">${rows.map((r,i)=>`<label class="improw${have.has(r.title)?" dup":""}"><input type="checkbox" data-i="${i}" ${picked.has(i)?"checked":""}><span class="imt">${esc(r.title)}${have.has(r.title)?` <em>已存在</em>`:""}</span>${r.likes!=null?`<span class="lk">♥ ${fmtNum(r.likes)}</span>`:""}</label>`).join("")}</div>
        <label class="f" for="impsrc">来源</label>

      sync();
    };
    let t; ta.addEventListener("input", ()=>{ clearTimeout(t); t = setTimeout(draw, 250); });
  });

function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } }
function hashN(str, n){ let h = 0; for (const ch of String(str)) h = (h*31 + ch.codePointAt(0)) >>> 0; return h % n; }
function coverHTML(it, big){
  const c = covers.get(it.id);
  if (c) return `<span class="cv img"${big?"":` style="aspect-ratio:${c.w}/${Math.min(c.h, c.w*1.6)}"`}><img src="${c.url}" alt="" loading="lazy"></span>`;
  const p = PLAT[it.platform] ? it.platform : "other";
  const ratio = ["3/4","4/5","3/4","1/1"][hashN(it.id, 4)];
  return `<span class="cv gen g-${p}" style="aspect-ratio:${ratio}"><span class="cvq">“</span><span class="cvt">${esc(it.title||it.note||"未命名灵感")}</span><span class="cvp">${PLAT[p]}</span></span>`;
}

/* ---------- sheets ---------- */
function openSheet(html, onMount){
  const root = $("#sheetRoot");
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet gutter" role="dialog" aria-modal="true"><div class="sheethead"><div class="grab"></div><button type="button" class="sheetx" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>${html}</div></div>`;
  $("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeSheet(); });
  root.querySelector(".sheetx").addEventListener("click", closeSheet);
  document.body.style.overflow="hidden";
  // swipe down to close: from the handle bar anytime, from the body when it's scrolled to the top
  const sh = root.querySelector(".sheet");
  let y0 = null, dy = 0, fromHead = false;
  sh.addEventListener("touchstart", e=>{
    fromHead = !!e.target.closest(".sheethead");
    if (!fromHead && (sh.scrollTop > 0 || e.target.closest("textarea,input,.implist,.tmlist"))) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; sh.style.transition = "none";
  }, {passive:true});
  sh.addEventListener("touchmove", e=>{
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0){ sh.style.transform = `translateY(${dy}px)`; if (fromHead) e.preventDefault(); }
  }, {passive:false});
  sh.addEventListener("touchend", ()=>{
    if (y0 === null) return; y0 = null;
    if (dy > 90){ sh.style.transition = "transform .18s ease-in"; sh.style.transform = "translateY(100%)"; setTimeout(closeSheet, 170); }
    else { sh.style.transition = "transform .18s ease-out"; sh.style.transform = ""; }
  });
  onMount && onMount(root.querySelector(".sheet"));
}
function closeSheet(){ $("#sheetRoot").innerHTML=""; document.body.style.overflow=""; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

function find(col,id){ return state.data[col].find(x=>x.id===id); }

function ideaDetail(id){
  const it = find("ideas",id); if(!it) return;
  const c = covers.get(it.id);
  openSheet(`
    ${c?`<div class="dcv"><img src="${c.url}" alt=""></div>`:""}
    ${platHTML(it.platform)}
    <h2>${esc(it.title||"未命名灵感")}</h2>
    ${tagsHTML(it.tags)}
    ${it.note?`<div class="note">${esc(it.note)}</div>`:`<div class="note" style="color:var(--muted)">还没有写介绍</div>`}
    ${it.url?`<div class="urlbox" id="urltext">${esc(it.url)}</div>`:""}
    <div class="actions">
      ${it.url?`<a class="btn primary grow" href="${esc(it.url)}" target="_blank" rel="noopener">打开原笔记 ↗</a><button class="btn" id="cpurl">复制链接</button>`:""}
    </div>
    ${state.canWrite?`<div class="actions"><button class="btn grow" id="edit">编辑 / 改 tag</button><button class="btn danger" id="del">删除</button></div>`:""}
  `, s=>{
    s.querySelector("#cpurl")?.addEventListener("click", ()=>copy(it.url, s.querySelector("#urltext")));
    s.querySelector("#edit")?.addEventListener("click", ()=>form("ideas", it));
    armDelete(s.querySelector("#del"), ()=>{ delItem("ideas", it.id); dropCover(it.id); closeSheet(); toast("已删除"); });
  });
}

function armDelete(btn, fn){
  if(!btn) return;
  btn.addEventListener("click", ()=>{
    if (btn.classList.contains("armed")) fn();
    else { btn.classList.add("armed"); btn.textContent="确认删除"; setTimeout(()=>{ btn.classList.remove("armed"); btn.textContent="删除"; }, 3000); }
  });
}

function tagPicker(col, selected){
  const sel = new Set(selected||[]);
  const wrap = document.createElement("div");
  let editing = false;
  const draw = () => {
    const tags = allTags(col); sel.forEach(t=>{ if(!tags.includes(t)) tags.push(t); });
    wrap.innerHTML = `<div class="pick${editing?" editing":""}">${tags.map(t=>`<button type="button" class="chip" data-t="${esc(t)}" aria-pressed="${!editing && sel.has(t)}"><span class="lbl">#${esc(t)}</span>${editing?`<span class="x" aria-hidden="true">✕</span>`:""}</button>`).join("")}
        <button type="button" class="chip ghost" id="tagedit">${editing?"完成":"删除 tag"}</button></div>
      ${editing?`<div class="hint">点 ✕ 删除。正在使用的 tag 要再点一次确认，会从所有内容上移除。</div>`:`<div class="addtag"><input class="input" id="newtag-${col}" placeholder="新 tag，比如：氛围感" maxlength="20"><button type="button" class="btn" id="addtagbtn">加上</button></div>`}`;
    wrap.querySelector("#tagedit").addEventListener("click", ()=>{ editing = !editing; draw(); });
    wrap.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click", async ()=>{
      const t = b.dataset.t;
      if (!editing){ sel.has(t)?sel.delete(t):sel.add(t); b.setAttribute("aria-pressed", sel.has(t)); return; }
      const n = tagUse(col, t);
      if (n && !b.classList.contains("armed")){ b.classList.add("armed"); b.querySelector(".lbl").textContent = `#${t} · ${n} 条在用，确认？`; return; }
      sel.delete(t); await deleteTag(col, t); toast(`已删除 #${t}`); draw();
    }));
    if (editing) return;
    const inp = wrap.querySelector("input");
    const add = () => { const t = inp.value.trim().replace(/^#/,""); if(t){ sel.add(t); unhideTag(col, t); draw(); wrap.querySelector("input").focus(); } };
    wrap.querySelector("#addtagbtn").addEventListener("click", add);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
  };
  draw();
  return { el:wrap, get:()=>[...sel] };
}

function platSeg(cur){
  return `<div class="seg" id="platseg">${["xhs","douyin","ins","other"].map(p=>`<button type="button" class="chip" data-p="${p}" aria-pressed="${cur===p}">${PLAT[p]}</button>`).join("")}</div>`;
}
function bindSeg(s, init){
  let v = init;
  const seg = s.querySelector("#platseg");
  const set = p => { v=p; seg.querySelectorAll("[data-p]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.p===p)); };
  seg.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>set(b.dataset.p)));
  return { get:()=>v, set };
}

function form(col, item){
  if (col==="photos") return photoForm(item);
  const editing = !!item, it = item || {};
  let html = "";
  if (col==="ideas"){
    html = `<h2>${editing?"编辑灵感":"添加灵感"}</h2>
      <form id="f">
        <label class="f" for="fi-url">链接（整段分享文字粘贴进来也行）</label>
        <textarea class="input" id="fi-url" rows="2" style="min-height:60px" placeholder="粘贴小红书 / 抖音 / ins 链接">${esc(it.url||"")}</textarea>
        <div class="hint" id="detect"></div>
        <label class="f" for="fi-title">标题</label>
        <input class="input" id="fi-title" value="${esc(it.title||"")}" placeholder="一句话记住它">
        <label class="f">封面</label>
        <input type="file" id="cvf" accept="image/*" hidden>
        <div class="cvpick" id="cvpick"></div>
        <div class="hint">在小红书 / 抖音里截一张图当封面最直观。不加的话会用标题自动生成一张。</div>
        <label class="f">平台</label>${platSeg(it.platform||"xhs")}
        <label class="f" for="fi-note">介绍 / 为什么存它</label>
        <textarea class="input" id="fi-note" placeholder="比如：开头 3 秒反差，机位从下往上，可以直接套">${esc(it.note||"")}</textarea>
        <label class="f">Tag</label><div id="tp"></div>
        <div class="actions"><button class="btn primary grow" type="submit">${editing?"保存":"添加"}</button>${editing?`<button class="btn danger" type="button" id="del">删除</button>`:""}</div>
      </form>`;
  } else if (col==="titles"){
    html = `<h2>${editing?"编辑标题":"添加标题"}</h2>
      <form id="f">
        <label class="f" for="fi-text">${editing?"标题":"标题（每行一条，可一次粘贴多条）"}</label>
        <textarea class="input" id="fi-text" placeholder="比如：下班后的 30 分钟，是我一天最贵的时间">${esc(it.text||"")}</textarea>
        <label class="f">Tag</label><div id="tp"></div>
        <div class="actions"><button class="btn primary grow" type="submit">${editing?"保存":"添加"}</button>${editing?`<button class="btn danger" type="button" id="del">删除</button>`:""}</div>
      </form>`;
  } else {
    html = `<h2>${editing?"编辑博主":"添加博主"}</h2>
      <form id="f">
        <label class="f" for="fi-name">博主名</label>
        <input class="input" id="fi-name" value="${esc(it.name||"")}" placeholder="昵称">
        <label class="f" for="fi-url">主页链接</label>
        <textarea class="input" id="fi-url" rows="2" style="min-height:60px" placeholder="粘贴主页链接或分享文字">${esc(it.url||"")}</textarea>
        <div class="hint" id="detect"></div>
        <label class="f">平台</label>${platSeg(it.platform||"xhs")}
        <label class="f" for="fi-comment">备注</label>
        <textarea class="input" id="fi-comment" placeholder="比如：构图和调色值得学，每周三更新">${esc(it.comment||"")}</textarea>
        <label class="f">Tag</label><div id="tp"></div>
        <div class="actions"><button class="btn primary grow" type="submit">${editing?"保存":"添加"}</button>${editing?`<button class="btn danger" type="button" id="del">删除</button>`:""}</div>
      </form>`;
  }
  openSheet(html, s=>{
    const tp = tagPicker(col, it.tags); s.querySelector("#tp").appendChild(tp.el);
    // cover: undefined = unchanged, null = remove, {blob,w,h} = new
    let coverNew, previewUrl = null;
    const cvpick = s.querySelector("#cvpick");
    const drawCover = () => {
      if (!cvpick) return;
      const cur = coverNew === undefined ? covers.get(it.id) : coverNew;
      if (previewUrl){ URL.revokeObjectURL(previewUrl); previewUrl = null; }
      const url = cur ? (cur.url || (previewUrl = URL.createObjectURL(cur.blob))) : null;
      cvpick.innerHTML = url
        ? `<img src="${url}" alt="封面预览"><div class="cvbtns"><button type="button" class="btn" id="cvchg">更换</button><button type="button" class="btn danger" id="cvrm">移除</button></div>`
        : `<button type="button" class="pickbtn" id="cvchg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>从相册选封面</button>`;
      cvpick.querySelector("#cvchg").addEventListener("click", ()=>s.querySelector("#cvf").click());
      cvpick.querySelector("#cvrm")?.addEventListener("click", ()=>{ coverNew = null; drawCover(); });
    };
    const takeImage = async file => { try{ coverNew = await compress(file, 1200); drawCover(); }catch(e){ toast("这张图读不出来，换一张试试"); } };
    if (cvpick){
      drawCover();
      s.querySelector("#cvf").addEventListener("change", e=>{ const f = e.target.files[0]; e.target.value = ""; if (f) takeImage(f); });
      s.addEventListener("paste", e=>{ const f = [...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/")); if (f){ e.preventDefault(); takeImage(f); } });
    }
    let seg = s.querySelector("#platseg") ? bindSeg(s, it.platform||"xhs") : null;
    const urlEl = s.querySelector("#fi-url");
    if (urlEl){
      urlEl.addEventListener("input", ()=>{
        const p = parseShare(urlEl.value);
        if (p.url){
          const pl = detectPlat(p.url); seg.set(pl);
          s.querySelector("#detect").textContent = `识别到：${PLAT[pl]} 链接`;
          const t = s.querySelector("#fi-title");
          if (t && !t.value.trim() && p.title) t.value = p.title;
          const n = s.querySelector("#fi-name");
          if (n && !n.value.trim()){ const mm = p.url.match(/instagram\.com\/([^/?#]+)/i); if(mm) n.value = mm[1]; }
        } else s.querySelector("#detect").textContent = "";
      });
    }
    armDelete(s.querySelector("#del"), ()=>{ delItem(col, it.id); if (col==="ideas") dropCover(it.id); closeSheet(); toast("已删除"); });
    s.querySelector("#f").addEventListener("submit", async e=>{
      e.preventDefault();
      const tags = tp.get();
      if (col==="ideas"){
        const raw = urlEl.value; const p = parseShare(raw);
        const url = normUrl(p.url || raw.trim());
        const title = s.querySelector("#fi-title").value.trim();
        if (!url && !title){ toast("至少填一个链接或标题"); return; }
        const obj = {title, url, platform:seg.get(), note:s.querySelector("#fi-note").value.trim(), tags};
        const id = editing ? it.id : uid();
        closeSheet();
        try{
          if (coverNew === null) await dropCover(id);
          else if (coverNew) await setCover(id, coverNew);
        }catch(err){ toast(err && err.name==="QuotaExceededError" ? "手机存储空间不够了，封面没存上" : "封面没存上，请重试"); }
        if (editing) await saveItem(col, id, {...strip(it), ...obj}); else await addItem(col, {id, ...obj});
        toast(editing?"已保存":"已添加");
      } else if (col==="titles"){
        const v = s.querySelector("#fi-text").value;
        if (editing){
          const text = v.trim(); if(!text){ toast("标题不能为空"); return; }
          closeSheet(); await saveItem(col, it.id, {...strip(it), text, tags}); toast("已保存");
        } else {
          const lines = v.split(/\n+/).map(x=>x.trim()).filter(Boolean);
          if(!lines.length){ toast("先粘贴标题"); return; }
          closeSheet();
          for (const text of lines) await addItem(col, {text, tags});
          toast(`已添加 ${lines.length} 条`);
        }
      } else {
        const raw = urlEl.value; const p = parseShare(raw);
        const url = normUrl(p.url || raw.trim());
        const name = s.querySelector("#fi-name").value.trim();
        if (!name && !url){ toast("至少填博主名或链接"); return; }
        const obj = {name, url, platform:seg.get(), comment:s.querySelector("#fi-comment").value.trim(), tags};
        closeSheet();
        if (editing) await saveItem(col, it.id, {...strip(it), ...obj}); else await addItem(col, obj);
        toast(editing?"已保存":"已添加");
      }
    });
  });
}

/* ---------- utils ---------- */
let toastT;
function toast(t){
  document.querySelector(".toast")?.remove();
  const d = document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(()=>d.remove(), 1600);
}
function copy(text, selectEl){
  const fallback = () => {
    if (selectEl){ const r=document.createRange(); r.selectNodeContents(selectEl); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("已选中，长按复制"); }
    else toast("复制失败，请长按文字复制");
  };
  try{ navigator.clipboard.writeText(text).then(()=>toast("已复制"), fallback); }catch(e){ fallback(); }
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ state.tab=b.dataset.tab; window.scrollTo(0,0); render(); }));
$("#q").addEventListener("input", e=>{ state.filter[state.tab].q = e.target.value; render(); });
$("#rail").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  if (b.dataset.manage){ tagManager(state.tab); return; }
  const f = state.filter[state.tab];
  if (b.dataset.plat){ f.plat = f.plat===b.dataset.plat ? null : b.dataset.plat; }
  else if (b.dataset.tag===""){ f.tag=null; if("plat" in f) f.plat=null; }
  else { f.tag = f.tag===b.dataset.tag ? null : b.dataset.tag; }
  render();
});
$("#view").addEventListener("click", e=>{
  const ph = e.target.closest("[data-photo]"); if(ph){ openViewer(ph.dataset.photo); return; }
  if (e.target.closest("#openImport")){ importSheet(); return; }
  const so = e.target.closest("[data-sort]"); if (so){ state.titleSort = so.dataset.sort; render(); return; }
  if (e.target.closest(".iopen") || e.target.closest(".tmeta a")) return;
  const o = e.target.closest("[data-open]"); if(o){ ideaDetail(o.dataset.open); return; }
  const c = e.target.closest("[data-copy]");
  if(c){ const it=find("titles",c.dataset.copy); const txt=c.closest(".trow").querySelector(".text");
    copy(it.text, txt); c.classList.add("ok"); setTimeout(()=>c.classList.remove("ok"),1200); return; }
  const ed = e.target.closest("[data-edit]"); if(ed){ form(state.tab, find(state.tab, ed.dataset.edit)); }
});
$("#fab").addEventListener("click", ()=>form(state.tab));
$("#vtoggle").addEventListener("click", e=>{
  const b = e.target.closest("[data-view]"); if(!b) return;
  state.ideaView = b.dataset.view; try{ localStorage.setItem("inspo-idea-view", state.ideaView); }catch(err){}
  render();
});
$("#view").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches(".irow")){ e.preventDefault(); ideaDetail(e.target.dataset.open); } });

/* ---------- photo form & viewer ---------- */
function photoForm(item){
  const editing = !!item, it = item || {};
  let files = [];
  openSheet(`
    <h2>${editing?"编辑照片":"添加照片"}</h2>
    <form id="f">
      ${editing?`<div class="previews" style="grid-template-columns:1fr 2fr"><img src="${it.url}" alt=""></div>`:`
      <input type="file" id="pf" accept="image/*" multiple hidden>
      <button type="button" class="pickbtn" id="pickbtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>从相册选照片（可多选）</button>
      <div class="previews" id="pv"></div>`}
      <label class="f" for="fi-note">备注</label>
      <textarea class="input" id="fi-note" placeholder="比如：侧身 45°，手放口袋，低机位往上拍">${esc(it.note||"")}</textarea>
      <label class="f">Tag</label><div id="tp"></div>
      <div class="actions"><button class="btn primary grow" type="submit" id="savebtn">${editing?"保存":"添加"}</button>${editing?`<button class="btn danger" type="button" id="del">删除</button>`:""}</div>
    </form>`, s=>{
    const tp = tagPicker("photos", it.tags); s.querySelector("#tp").appendChild(tp.el);
    if (!editing){
      const inp = s.querySelector("#pf"), pv = s.querySelector("#pv");
      s.querySelector("#pickbtn").addEventListener("click", ()=>inp.click());
      inp.addEventListener("change", ()=>{
        files = files.concat([...inp.files]); inp.value = "";
        pv.innerHTML = ""; files.forEach(f=>{ const im=document.createElement("img"); im.src=URL.createObjectURL(f); im.onload=()=>URL.revokeObjectURL(im.src); pv.appendChild(im); });
        s.querySelector("#pickbtn").lastChild.textContent = `已选 ${files.length} 张，点这里继续加`;
      });
    }
    armDelete(s.querySelector("#del"), async ()=>{ closeSheet(); closeViewer(); try{ await delPhoto(it.id); toast("已删除"); }catch(e){ toast("删除失败，请重试"); } });
    s.querySelector("#f").addEventListener("submit", async e=>{
      e.preventDefault();
      const note = s.querySelector("#fi-note").value.trim(), tags = tp.get();
      if (editing){
        try{ await putPhoto({id:it.id, blob:it.blob, w:it.w, h:it.h, createdAt:it.createdAt, note, tags}); it.note=note; it.tags=tags; mirrorSoon(); closeSheet(); render(); if(viewerState) showViewer(); toast("已保存"); }
        catch(err){ toast("保存失败，请重试"); }
        return;
      }
      if (!files.length){ toast("先选照片"); return; }
      const btn = s.querySelector("#savebtn"); btn.disabled = true;
      try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
      let ok = 0, bad = 0, i = 0;
      for (const f of files){
        btn.textContent = `处理中 ${++i}/${files.length}`;
        try{
          const {blob,w,h} = await compress(f);
          const rec = {id:uid(), blob, w, h, note, tags, createdAt:Date.now()+i};
          await addPhotoRec(rec); ok++;
        }catch(err){ bad++; if (err && err.name==="QuotaExceededError"){ toast("手机存储空间不够了"); break; } }
      }
      closeSheet(); render();
      toast(bad ? `已添加 ${ok} 张，${bad} 张读不出来` : `已添加 ${ok} 张`);
    });
  });
}

let viewerState = null;
function openViewer(id){
  const list = filtered("photos"); const i = list.findIndex(x=>x.id===id); if (i<0) return;
  viewerState = {list, i}; showViewer();
}
function closeViewer(){ viewerState = null; const v = document.getElementById("viewer"); if(v) v.remove(); document.body.style.overflow=""; }
function showViewer(){
  if (!viewerState) return;
  const {list} = viewerState; const it = list[viewerState.i]; if(!it){ closeViewer(); return; }
  let v = document.getElementById("viewer");
  if (!v){ v = document.createElement("div"); v.id="viewer"; v.className="viewer"; v.setAttribute("role","dialog"); v.setAttribute("aria-modal","true"); document.body.appendChild(v); }
  document.body.style.overflow="hidden";
  v.innerHTML = `
    <div class="vtop"><button class="vbtn" data-v="close" aria-label="关闭">✕</button><span>${viewerState.i+1} / ${list.length}</span>${state.canWrite?`<button class="vbtn" data-v="edit">编辑</button>`:"<span></span>"}</div>
    <div class="vstage"><img src="${it.url}" alt="${esc(it.note||"")}">
      ${list.length>1?`<button class="vnav l" data-v="prev" aria-label="上一张">‹</button><button class="vnav r" data-v="next" aria-label="下一张">›</button>`:""}</div>
    ${(it.note||(it.tags&&it.tags.length))?`<div class="vinfo">${it.note?`<div class="vnote">${esc(it.note)}</div>`:""}${tagsHTML(it.tags)}</div>`:""}`;
}
function step(d){ if(!viewerState) return; const n = viewerState.list.length; viewerState.i = (viewerState.i + d + n) % n; showViewer(); }
document.addEventListener("click", e=>{
  const b = e.target.closest("#viewer [data-v]"); if(!b) return;
  const a = b.dataset.v;
  if (a==="close") closeViewer(); else if (a==="prev") step(-1); else if (a==="next") step(1);
  else if (a==="edit"){ const it = viewerState.list[viewerState.i]; photoForm(state.data.photos.find(x=>x.id===it.id)); }
});
let tx0 = null, ty0 = null;
document.addEventListener("touchstart", e=>{ if(!e.target.closest("#viewer .vstage")) return; tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e=>{
  if (tx0===null) return; const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0; tx0 = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) closeViewer();
}, {passive:true});
document.addEventListener("keydown", e=>{ if(!viewerState || document.querySelector("#scrim")) return; if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1); else if(e.key==="Escape") closeViewer(); });

/* ---------- backup (local mode) ---------- */
$("#backupBtn").addEventListener("click", ()=>{
  const n = COLS.reduce((s,c)=>s+state.data[c].length,0), np = state.data.photos.length;
  openSheet(`
    <h2>备份与恢复</h2>
    ${FS?`<div class="okline"><span class="dotok${mirrorOK?"":" bad"}"></span><div><b>${mirrorOK?"自动备份已开启":"自动备份暂时失败，下次改动会再试"}</b><br>
      每次改动都会自动存一份到「文件」App → 我的 iPhone → 灵感池，iPhone 的 iCloud 备份也会带上它。app 里的数据万一丢了，打开时会自动从这里恢复，不用你操作。${lastMirror?`<br><span style="color:var(--muted)">上次保存 ${lastMirror.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}</span>`:""}</div></div>
      <div class="hint" style="font-size:13px">删除 app 会连这份备份一起删掉。7 天过期打不开时，在 Xcode 里重新点 ▶ 就行，不要删 app。换新手机前，导出一份完整备份存到 iCloud 云盘。</div>`
    :`<div class="hint" style="font-size:14px">当前共 ${n} 条记录、${np} 张照片。数据只存在这个浏览器里，清缓存或换手机前先导出一份。</div>`}
    <div class="actions"><button class="btn ${FS?"":"primary "}grow" id="exp">导出完整备份文件</button></div>
    <label class="f" for="impfile">从备份文件恢复（会和现有内容合并，重复的不会加两次）</label>
    <input type="file" id="impfile" accept=".json,application/json" class="input">
  `, s=>{
    s.querySelector("#exp").addEventListener("click", async ()=>{
      const eb = s.querySelector("#exp"); eb.disabled = true; eb.textContent = "正在打包…";
      const photos = [];
      for (const p of state.data.photos) photos.push({id:p.id, note:p.note, tags:p.tags, createdAt:p.createdAt, w:p.w, h:p.h, data: await blobToDataURL(p.blob)});
      const coverList = [];
      for (const [id,c] of covers) coverList.push({id, w:c.w, h:c.h, data: await blobToDataURL(c.blob)});
      const out = {app:"inspo-pool",v:3,exportedAt:new Date().toISOString(),photos,covers:coverList,hidden:state.hidden}; COLS.forEach(c=>out[c]=state.data[c]);
      const json = JSON.stringify(out), fname = `灵感池备份-${new Date().toISOString().slice(0,10)}.json`;
      eb.disabled = false; eb.textContent = "导出完整备份文件";
      if (NATIVE){
        try{
          const {Filesystem, Share} = window.Capacitor.Plugins;
          const w = await Filesystem.writeFile({path:fname, data:json, directory:"CACHE", encoding:"utf8"});
          await Share.share({title:"灵感池备份", url:w.uri});
        }catch(err){ if(!/cancel/i.test(String(err && err.message))) toast("导出失败，请重试"); }
        return;
      }
      const blob = new Blob([json],{type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      toast("已导出");
    });
    s.querySelector("#impfile").addEventListener("change", e=>{
      const file = e.target.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = async () => {
        try{
          const j = JSON.parse(r.result); let added = 0;
          if (Array.isArray(j.photos)){
            const have = new Set(state.data.photos.map(x=>x.id));
            for (const x of j.photos){
              if (!x || !x.data || have.has(x.id)) continue;
              try{ const blob = await (await fetch(x.data)).blob(); const rec = {id:x.id||uid(), blob, w:x.w, h:x.h, note:x.note||"", tags:x.tags||[], createdAt:x.createdAt||Date.now()}; await addPhotoRec(rec); added++; }catch(e){}
            }
          }
          if (Array.isArray(j.covers)){
            for (const x of j.covers){ if (!x || !x.data || covers.has(x.id)) continue; try{ const blob = await (await fetch(x.data)).blob(); await setCover(x.id, {blob, w:x.w, h:x.h}); }catch(e){} }
          }
          if (j.hidden) COLS.concat("photos").forEach(c=>{ (j.hidden[c]||[]).forEach(t=>{ if(!state.hidden[c].includes(t)) state.hidden[c].push(t); }); });
          COLS.forEach(c=>{
            if(!Array.isArray(j[c])) return;
            const have = new Set(state.data[c].map(x=>x.id));
            j[c].forEach(x=>{ if(x && typeof x==="object" && !have.has(x.id)){ state.data[c].push({...x, id:x.id||uid()}); added++; } });
          });
          saveLocal(); closeSheet(); render(); toast(`已恢复 ${added} 条`);
        }catch(err){ toast("文件格式不对，请选择导出的备份文件"); }
      };
      r.readAsText(file);
    });
  });
});


/* ---------- iOS gesture guards ---------- */
["gesturestart","gesturechange"].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), {passive:false}));

/* ---------- add to home screen ---------- */
(function(){
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let dismissed = false; try{ dismissed = localStorage.getItem("inspo-install-dismissed")==="1"; }catch(e){}
  if (standalone || dismissed || window.claude || NATIVE) return;
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const inApp = /MicroMessenger|XiaoHongShu|discover|aweme|Weibo|QQ\//i.test(ua);
  const isMobile = isIOS || /Android/i.test(ua);
  if (!isMobile) return;
  const wrap = $("#installWrap"), tip = $("#installTip"), btn = $("#installBtn");
  if (inApp) tip.textContent = "先点右上角「···」，选择在浏览器中打开，再添加";
  else if (isIOS) tip.textContent = /CriOS|FxiOS|EdgiOS/.test(ua) ? "点分享按钮 → 添加到主屏幕（建议用 Safari 打开）" : "点底部分享按钮 ⎙ → 添加到主屏幕";
  else tip.textContent = "点浏览器菜单 ⋮ → 添加到主屏幕 / 安装应用";
  wrap.hidden = false;
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred = e; btn.hidden = false; tip.textContent = "装到手机桌面，像 app 一样打开"; });
  btn.addEventListener("click", async ()=>{ if(!deferred) return; deferred.prompt(); const r = await deferred.userChoice; deferred = null; if (r.outcome==="accepted") wrap.hidden = true; });
  window.addEventListener("appinstalled", ()=>{ wrap.hidden = true; });
  $("#installClose").addEventListener("click", ()=>{ wrap.hidden = true; try{ localStorage.setItem("inspo-install-dismissed","1"); }catch(e){} });
})();
render();
boot();
})();
</script>
